<svg xmlns="http://www.w3.org/2000/svg" width="920" height="963" viewBox="0 30 920 963" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#000000"/></marker></defs><rect x="0" y="30" width="920" height="993" fill="white"/><circle cx="360" cy="42" r="10" fill="#000000"/><line x1="360" y1="52" x2="360" y2="68" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125.0" y="70" width="470" height="44" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="360.0" y="92.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">1  Ingest: download 3,670 flower photos in 5 class folders</text><line x1="360" y1="114" x2="360" y2="130" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125.0" y="132" width="470" height="44" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="360.0" y="154.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">2  Inventory: record label, size, colour mode and readability</text><line x1="360" y1="176" x2="360" y2="192" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125.0" y="194" width="470" height="58" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="360.0" y="215.2" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">3  Clean: remove corrupt, tiny, extreme-aspect and duplicate images</text><text x="360.0" y="230.8" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">(21 removed, 3,649 kept)</text><line x1="360" y1="252" x2="360" y2="266" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125.0" y="268" width="470" height="44" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="360.0" y="290.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">4  Stratified split: 70 % training, 15 % validation, 15 % test</text><line x1="360" y1="312" x2="360" y2="328" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125.0" y="330" width="470" height="58" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="360.0" y="351.2" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">5  Pre-process: resize and normalise all images; augment</text><text x="360.0" y="366.8" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">the training images only</text><line x1="360" y1="388" x2="360" y2="412" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><polygon points="360,412 376,428 360,444 344,428" fill="#efefef" stroke="#000000" stroke-width="1.6"/><line x1="360" y1="444" x2="360" y2="462" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125.0" y="464" width="470" height="58" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="360.0" y="485.2" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">6  Take the next candidate model (CNN without augmentation,</text><text x="360.0" y="500.8" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">CNN with augmentation, MobileNetV3)</text><line x1="360" y1="522" x2="360" y2="540" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125.0" y="542" width="470" height="44" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="360.0" y="564.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">7  Select the learning rate by short trial runs (validation F1)</text><line x1="360" y1="586" x2="360" y2="604" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125.0" y="606" width="470" height="58" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="360.0" y="627.2" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">8  Train; after each epoch keep the weights with the best</text><text x="360.0" y="642.8" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">validation F1 (early stopping)</text><line x1="360" y1="664" x2="360" y2="682" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125.0" y="684" width="470" height="44" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="360.0" y="706.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">9  Measure accuracy, macro F1, confusion matrix, size, latency</text><line x1="360" y1="728" x2="360" y2="746" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><polygon points="360,746.0 435.0,774 360,802.0 285.0,774" fill="#efefef" stroke="#000000" stroke-width="1.6"/><text x="360" y="766.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">more</text><text x="360" y="781.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">candidates?</text><polyline points="285,774 70,774 70,428 342,428" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><text x="80" y="762.0" font-size="11.5" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222222">[yes]</text><line x1="360" y1="802" x2="360" y2="826" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><text x="370" y="814.0" font-size="11.5" text-anchor="start" dominant-baseline="middle" font-weight="normal" fill="#222222">[no]</text><rect x="125.0" y="828" width="470" height="44" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="360.0" y="850.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">10  Choose the model with the highest validation F1 (MobileNetV3)</text><line x1="360" y1="872" x2="360" y2="890" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125.0" y="892" width="470" height="44" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="360.0" y="914.0" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">11  Report its test metrics and save weights + class list</text><line x1="360" y1="936" x2="360" y2="954" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><circle cx="360" cy="966" r="12" fill="white" stroke="#000000" stroke-width="1.6"/><circle cx="360" cy="966" r="7" fill="#000000"/><path d="M650,150 H886 L900,164 V280 H650 Z" fill="#efefef" stroke="#000000" stroke-width="1.4"/><path d="M886,150 V164 H900" fill="none" stroke="#000000" stroke-width="1.4"/><text x="775.0" y="186.5" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Cleaning precedes splitting so</text><text x="775.0" y="200.7" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">that near-duplicates cannot fall</text><text x="775.0" y="215.0" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">into both training and test sets.</text><text x="775.0" y="229.3" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Augmentation is applied to</text><text x="775.0" y="243.5" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">training images only.</text><line x1="650" y1="230" x2="595.0" y2="222" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 4"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>