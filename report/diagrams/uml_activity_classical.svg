<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="545" viewBox="0 30 1060 545" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#000000"/></marker></defs><rect x="0" y="30" width="1060" height="575" fill="white"/><circle cx="530.0" cy="48" r="10" fill="#000000"/><line x1="530.0" y1="58" x2="530.0" y2="78" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="240.0" y="80" width="580" height="46" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="530.0" y="103.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Load the test photos (one scene + a pair + an unrelated photo)</text><line x1="530.0" y1="126" x2="530.0" y2="146" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="60" y="148" width="940" height="7" fill="#000000"/><line x1="164.5" y1="155" x2="164.5" y2="178" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><text x="164.5" y="192.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#000000">Noise removal</text><rect x="52" y="208" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="164.5" y="227.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Add known noise</text><text x="164.5" y="242.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">(grainy / speckled)</text><line x1="164.5" y1="262" x2="164.5" y2="282" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="52" y="284" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="164.5" y="303.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Apply box, Gaussian</text><text x="164.5" y="318.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">and median filters</text><line x1="164.5" y1="338" x2="164.5" y2="358" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="52" y="360" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="164.5" y="379.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Score each against</text><text x="164.5" y="394.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">the clean photo (PSNR)</text><line x1="164.5" y1="414" x2="164.5" y2="440" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><line x1="414.5" y1="155" x2="414.5" y2="178" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><text x="414.5" y="192.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#000000">Frequency analysis</text><rect x="302" y="208" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="414.5" y="227.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Convert photo to</text><text x="414.5" y="242.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">frequencies (FFT)</text><line x1="414.5" y1="262" x2="414.5" y2="282" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="302" y="284" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="414.5" y="303.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Keep low or high</text><text x="414.5" y="318.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">frequencies (masks)</text><line x1="414.5" y1="338" x2="414.5" y2="358" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="302" y="360" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="414.5" y="379.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Convert back and</text><text x="414.5" y="394.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">compare results</text><line x1="414.5" y1="414" x2="414.5" y2="440" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><line x1="664.5" y1="155" x2="664.5" y2="178" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><text x="664.5" y="192.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#000000">Edges</text><rect x="552" y="208" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="664.5" y="235.0" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Smooth slightly</text><line x1="664.5" y1="262" x2="664.5" y2="282" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="552" y="284" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="664.5" y="303.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Measure brightness</text><text x="664.5" y="318.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">change (Sobel)</text><line x1="664.5" y1="338" x2="664.5" y2="358" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="552" y="360" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="664.5" y="379.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Keep thin, connected</text><text x="664.5" y="394.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">edges (Canny)</text><line x1="664.5" y1="414" x2="664.5" y2="440" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><line x1="914.5" y1="155" x2="914.5" y2="178" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><text x="914.5" y="192.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#000000">Feature matching</text><rect x="802" y="208" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="914.5" y="227.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Find distinctive points</text><text x="914.5" y="242.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">(Harris / SIFT / ORB)</text><line x1="914.5" y1="262" x2="914.5" y2="282" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="802" y="284" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="914.5" y="303.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Pair points with the</text><text x="914.5" y="318.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">ratio test</text><line x1="914.5" y1="338" x2="914.5" y2="358" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="802" y="360" width="225" height="54" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="914.5" y="379.6" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Keep pairs that agree</text><text x="914.5" y="394.4" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">on one geometry (RANSAC)</text><line x1="914.5" y1="414" x2="914.5" y2="440" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="60" y="442" width="940" height="7" fill="#000000"/><line x1="530.0" y1="449" x2="530.0" y2="470" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><rect x="330.0" y="472" width="400" height="46" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="530.0" y="495.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="normal" fill="#000000">Save every picture and score for the report</text><line x1="530.0" y1="518" x2="530.0" y2="538" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/><circle cx="530.0" cy="550" r="12" fill="white" stroke="#000000" stroke-width="1.6"/><circle cx="530.0" cy="550" r="7" fill="#000000"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>